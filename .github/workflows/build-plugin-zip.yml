name: Build installable WordPress plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -e
          mkdir -p build/ua-project-manager
          cp ua-project-manager.php build/ua-project-manager/
          cp -R includes build/ua-project-manager/
          if [ -d assets ]; then cp -R assets build/ua-project-manager/; fi
          if [ -d languages ]; then cp -R languages build/ua-project-manager/; fi
          if [ -f readme.txt ]; then cp readme.txt build/ua-project-manager/; fi
          if [ -f README.md ]; then cp README.md build/ua-project-manager/; fi
          cd build
          zip -qr ../ua-project-manager-1.0.8.zip ua-project-manager
          unzip -t ../ua-project-manager-1.0.8.zip


      - name: Publish GitHub release for WordPress updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: UA Project Manager 1.0.8
          body: |
            UA Project Manager 1.0.8

            - Embedded UA Pay Box 1.3.10 functionality into the single UA Project Manager plugin.
            - Embedded UA Web Finder 2.6.0 functionality into the single UA Project Manager plugin.
            - Preserved the existing Pay Box and Web Finder database table names and options for in-place data continuity.
            - Added shared customer/contact synchronization paths between Finder and the manager.
            - Fixed the embedded Finder Contacts submenu placement and namespaced callback.
            - Includes the current pro-development integration work; further functional testing and refinements will continue in subsequent updates.
          files: ua-project-manager-1.0.8.zip
          make_latest: true
          overwrite_files: true

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ua-project-manager-1.0.8
          path: ua-project-manager-1.0.8.zip
          if-no-files-found: error
          retention-days: 14
