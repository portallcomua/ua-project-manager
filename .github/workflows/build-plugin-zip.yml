name: Manual plugin ZIP build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read plugin version
        id: meta
        shell: bash
        run: |
          VERSION=$(php -r '$s=file_get_contents("ua-project-manager.php"); preg_match("/Version:\s*([0-9.]+)/", $s, $m); echo $m[1] ?? "";')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p build/ua-project-manager
          cp ua-project-manager.php build/ua-project-manager/
          cp -R includes build/ua-project-manager/
          if [ -d assets ]; then cp -R assets build/ua-project-manager/; fi
          if [ -d languages ]; then cp -R languages build/ua-project-manager/; fi
          if [ -f readme.txt ]; then cp readme.txt build/ua-project-manager/; fi
          if [ -f README.md ]; then cp README.md build/ua-project-manager/; fi
          cd build
          zip -qr "../ua-project-manager-${{ steps.meta.outputs.version }}.zip" ua-project-manager
          unzip -t "../ua-project-manager-${{ steps.meta.outputs.version }}.zip"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-project-manager-${{ steps.meta.outputs.version }}
          path: ua-project-manager-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
