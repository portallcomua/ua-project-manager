name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - next-1.1.0-shared-sync-advertising
      - test-1.1.1-integrated
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        timeout-minutes: 6
        run: set -o pipefail; gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee android-build.log
        working-directory: android
      - name: Report Android build failure to the test PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('android/android-build.log') ? fs.readFileSync('android/android-build.log', 'utf8').slice(-12000) : 'No Gradle log file was produced.';
            const prs = await github.rest.pulls.list({owner: context.repo.owner, repo: context.repo.repo, state: 'open', head: 'portallcomua:test-1.1.1-integrated'});
            if (prs.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.data[0].number,
                body: 'Android APK build diagnostic (last log lines):\n\n\u0060\u0060\u0060text\n' + log + '\n\u0060\u0060\u0060'
              });
            }
      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/android-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ua-project-manager-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare named APK asset
        if: success()
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ua-project-manager-android-tasks-0.1.0.apk
      - name: Publish Android test APK release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.0
          target_commitish: main
          name: UA Project Manager Android Tasks 0.1.0
          body: |
            Перша тестова Android-версія UA Project Manager.
            Поки доступний лише модуль задач: локальне збереження, офлайн-створення/редагування/виконання та синхронізація з WordPress через HTTPS і Application Password.
            Це debug APK для тестування, не реліз Google Play.
          files: ua-project-manager-android-tasks-0.1.0.apk
          make_latest: false
