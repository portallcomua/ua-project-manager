name: PHP syntax check for embedded modules

on:
  push:
    branches:
      - pro-development
      - next-1.1.0-shared-sync-advertising
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Check every PHP file
        shell: bash
        run: |
          set -e
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
