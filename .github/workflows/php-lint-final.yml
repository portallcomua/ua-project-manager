name: Validate integrated plugin PHP syntax

on:
  push:
    branches:
      - pro-development
      - next-1.1.0-shared-sync-advertising
      - test-1.1.1-integrated
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: PHP syntax check
        run: |
          set -e
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: |
          set -e
          find includes -type f -name '*.js' -print0 | xargs -0 -n1 node --check
